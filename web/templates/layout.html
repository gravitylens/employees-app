<!doctype html>
<html>
<head>
    <title>{% block title %}Employees App{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
<header>
    <h1>{% block header %}Employees App{% endblock %}</h1>
</header>
{% if session.get('logged_in') %}
<nav>
    <a href="{{ url_for('employees') }}">Employees</a>
    <a href="{{ url_for('departments') }}">Departments</a>
    <a href="{{ url_for('logout') }}">Logout</a>
</nav>
{% endif %}
{% block content %}{% endblock %}
</body>
</html>
