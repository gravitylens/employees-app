{% extends "layout.html" %}
{% block title %}Departments{% endblock %}
{% block header %}Departments{% endblock %}
{% block content %}
    <table>
        <tr><th>ID</th><th>Name</th></tr>
        {% for d in departments %}
        <tr>
            <td><a href="{{ url_for('department_detail', dept_no=d.dept_no) }}">{{ d.dept_no }}</a></td>
            <td>{{ d.dept_name }}</td>
        </tr>
        {% endfor %}
    </table>
{% endblock %}
